<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Templat susun atur permainan</title>
</head>
<body>
<!--
  ============================================================================
  templates.html  -  SUSUN ATUR (HTML) BAGI KOTAK-KOTAK PERMAINAN
  ============================================================================
  Fail ini ialah tempat anda membaca dan mengubah rupa (susun atur) permainan.
  Setiap <template> ialah satu "kotak". JavaScript (core.js: fungsi tpl()) hanya
  menyalin kotak ini dan mengisi teksnya. Warna dan saiz pula ada dalam game.css.

  Cara membaca:
    id="tpl-xxx"      nama kotak
    data-ref="xxx"    tempat yang JavaScript akan isi atau tambah gambar
    data-text="xxx"   tempat teks yang diisi oleh JavaScript (selamat, bukan HTML)

  Kotak dalam fail ini:
    1. tpl-dialogue    kotak dialog (nama, teks, potret kiri / kanan, pilihan Giliran Anda)
    2. tpl-aftermath   adegan "Akibat" (apa yang berlaku bila jawapan salah)
    3. tpl-possession  kad "KAU KINI IALAH ..." (jiwa pelajar masuk ke jasad tokoh)
    4. tpl-diary       halaman diari + nota lekat selepas misi
    5. tpl-hotspot     misi Cari Bukti (gambar + panel bukti di kanan yang boleh ditutup)
    6. tpl-pieces      kertas koyak: kepingan LENCANA bertambah selepas setiap misi
    7. tpl-artifak     hadiah Kepungan: artifak yang digelapkan (sebelum perang bermula)
    8. tpl-bookend     akhir era: halaman diari / kepingan terkumpul ke dalam buku
    9. tpl-sound       tetapan bunyi di Pintu (hab): senyap + gelangsar muzik / kesan
  ============================================================================
-->

  <!-- 1. KOTAK DIALOG ------------------------------------------------------
       Tokoh lain: potret di kiri. Kau (pelajar): potret di kanan, kotak biru
       (data-tone="me" ditetapkan oleh JavaScript, rupanya dalam game.css). -->
  <template id="tpl-dialogue">
    <div class="dlg hidden">
      <div class="dlg-portrait" data-ref="portrait"></div>      <!-- potret penutur -->
      <div class="dlg-portrait dlg-me" data-ref="mePortrait"></div> <!-- potret kau, hanya semasa Giliran Anda -->
      <div class="dlg-panel px" data-ref="panel">
        <div class="dlg-name" data-ref="name"></div>             <!-- nama penutur -->
        <div class="dlg-text" data-ref="text"></div>             <!-- ayat (ditaip satu-satu) -->
        <div class="dlg-more" data-ref="more">▼</div>           <!-- tanda "tekan Enter" -->
      </div>
      <div class="dlg-choices" data-ref="choices"></div>         <!-- butang pilihan jawapan -->
    </div>
  </template>

  <!-- 2. ADEGAN AKIBAT -------------------------------------------------------
       Gambar latar dikuncupkan warnanya, retak, cop "SEJARAH BERUBAH",
       kemudian akibat ditaip. -->
  <template id="tpl-aftermath">
    <div class="am-wrap">
      <div class="am-pic" data-ref="pic"></div>                  <!-- gambar latar babak -->
      <div class="am-crack"><i></i><i></i></div>                 <!-- retakan benang cerita -->
      <div class="am-card px">
        <div class="am-stamp" data-text="title"></div>           <!-- cop: SEJARAH BERUBAH -->
        <div class="am-label">Apa yang berlaku...</div>
        <p class="am-text" data-ref="text"></p>                  <!-- akibat (ditaip) -->
        <div class="am-go">Tekan Enter ▶</div>
      </div>
    </div>
  </template>

  <!-- 3. KAD PERASUKAN (POSSESSION) -----------------------------------------
       Avatar pelajar  ⟶  tokoh sebenar. Kemudian Pendekar Bayang menerangkan. -->
  <template id="tpl-possession">
    <div class="pos-wrap">
      <div class="pos-glow"></div>
      <div class="pos-stage">
        <div class="pos-from" data-ref="from"></div>             <!-- avatar pelajar -->
        <div class="pos-arrow">⟶</div>
        <div class="pos-to" data-ref="to"></div>                 <!-- tokoh peranan -->
      </div>
      <div class="pos-card px">
        <div class="pos-label">KAU KINI IALAH</div>
        <div class="pos-name" data-text="name"></div>            <!-- nama tokoh -->
        <div class="pos-task" data-text="task"></div>            <!-- sumbangan tokoh -->
        <div class="pos-go" data-ref="go">Tekan Enter ▶</div>
      </div>
    </div>
  </template>

  <!-- 4. HALAMAN DIARI + NOTA LEKAT -----------------------------------------
       Dipaparkan dalam tetingkap selepas misi berjaya. Kertas = halaman.png
       (ditetapkan sebagai --paper-img dalam game.css). -->
  <template id="tpl-diary">
    <div class="diary-page">
      <span class="diary-tab" data-text="tab"></span>            <!-- "Diari <nama tokoh>" -->
      <p class="sticky" data-text="note"></p>                    <!-- catatan (nota lekat kuning) -->
    </div>
  </template>

  <!-- 5. MISI CARI BUKTI ---------------------------------------------------
       Gambar penuh untuk dicari. Senarai bukti ada di PANEL KANAN yang boleh
       ditutup (butang ◀/▶), supaya tiada bukti tersembunyi di bawah nama. -->
  <template id="tpl-hotspot">
    <div class="hs-root">
      <div class="hs-scene" data-ref="scene"></div>             <!-- gambar yang diklik -->
      <aside class="hs-side px" data-ref="side">                 <!-- panel kanan -->
        <button class="hs-toggle" data-ref="toggle" type="button" title="Buka / tutup senarai bukti">▶</button>
        <div class="hs-side-title">BUKTI <span data-ref="count"></span></div>
        <ol class="hs-slots" data-ref="slots"></ol>             <!-- 1. ??? / nama bukti yang dijumpai -->
      </aside>
    </div>
  </template>

  <!-- 6. KEPINGAN LENCANA ---------------------------------------------------
       Dipaparkan selepas setiap misi (kecuali yang terakhir, kerana lencana penuh
       terus diberikan). Latar = kertas koyak (hub/halaman.png).
       Atas: nama era. Tengah: lencana sebagai bayang; kepingan koyak yang sudah diperoleh berwarna.
       Bawah: bilangan kepingan. Satu misi = satu kepingan.
       JavaScript (missionScene.js: showPieces) mengisi <svg data-ref="svg"> dengan kepingan;
       bentuk kepingan dikira dalam koyak.js. -->
  <template id="tpl-pieces">
    <div class="pc-wrap">
      <div class="pc-sheet">                                      <!-- bayang kertas (drop-shadow tidak ikut koyakan jika di luar clip) -->
        <div class="pc-paper">                                    <!-- halaman.png, tepi dikoyakkan dengan clip-path -->
          <div class="pc-era" data-text="era"></div>             <!-- nama era -->
          <svg class="pc-svg" data-ref="svg" viewBox="0 0 300 300"></svg>   <!-- kepingan kertas koyak lencana -->
          <div class="pc-count" data-text="count"></div>         <!-- contoh: 2 / 5 -->
          <div class="pc-note">kepingan lencana</div>
        </div>
      </div>
      <div class="pc-go" data-ref="go">Tekan Enter ▶</div>
    </div>
  </template>

  <!-- 7. ARTIFAK KEPUNGAN (BAYANG) ------------------------------------------
       Sebelum perang: murid nampak artifak yang digelapkan + markah yang perlu dicapai.
       Hanya motivasi; artifak sebenar dibuka selepas Kepungan (kesan meriam sedia ada). -->
  <template id="tpl-artifak">
    <div class="af-wrap">
      <div class="af-card px">
        <div class="af-label">HADIAH KEPUNGAN</div>
        <div class="af-stage">
          <img class="af-base" src="../assets/gameAsset/collection/artifact_place_locked.png" alt="">
          <img class="af-sprite" data-ref="sprite" alt="">       <!-- artifak (bayang gelap) -->
        </div>
        <div class="af-need" data-text="need"></div>             <!-- contoh: Capai 80% untuk membukanya -->
      </div>
    </div>
  </template>


  <!-- 8. KISAH ERA LENGKAP -------------------------------------------------
       Akhir cerita: setiap misi = satu halaman kertas yang terbang masuk ke dalam buku.
       JavaScript (missionScene.js: showBookEnd) menambah halaman ke <div data-ref="pages">. -->
  <template id="tpl-bookend">
    <div class="be-wrap">
      <div class="be-pages" data-ref="pages"></div>              <!-- halaman kertas (satu setiap misi) -->
      <div class="be-book" data-ref="book"></div>                <!-- buku.png -->
      <div class="be-title" data-text="title"></div>             <!-- contoh: Kisah Era 2 lengkap -->
      <div class="be-count" data-text="count"></div>             <!-- contoh: 5 halaman -->
    </div>
  </template>

  <!-- 9. TETAPAN BUNYI -----------------------------------------------------
       Dipaparkan dalam kotak "Pintu" di hab. Gelangsar 0 - 100, disimpan dalam pelayar.
       JavaScript (scenes.js: doorMenu) mengisi nilai dan mendengar perubahan. -->
  <template id="tpl-sound">
    <div class="set-sound">
      <button class="btn-px small set-mute" data-ref="mute"></button>   <!-- senyap / hidupkan -->
      <label class="set-row">Muzik <input type="range" min="0" max="100" data-ref="music"></label>
      <label class="set-row">Kesan bunyi <input type="range" min="0" max="100" data-ref="sfx"></label>
    </div>
  </template>
</body>
</html>
