<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Templat susun atur permainan</title>
</head>
<body>
<!--
  ============================================================================
  templates.html  -  SUSUN ATUR (HTML) BAGI KOTAK-KOTAK PERMAINAN
  ============================================================================
  Fail ini ialah tempat anda membaca dan mengubah rupa (susun atur) permainan.
  Setiap <template> ialah satu "kotak". JavaScript (core.js: fungsi tpl()) hanya
  menyalin kotak ini dan mengisi teksnya. Warna dan saiz pula ada dalam game.css.

  Cara membaca:
    id="tpl-xxx"      nama kotak
    data-ref="xxx"    tempat yang JavaScript akan isi atau tambah gambar
    data-text="xxx"   tempat teks yang diisi oleh JavaScript (selamat, bukan HTML)

  Kotak dalam fail ini:
    1. tpl-dialogue    kotak dialog (nama, teks, potret kiri / kanan, pilihan Giliran Anda)
    2. tpl-aftermath   adegan "Akibat" (apa yang berlaku bila jawapan salah)
    3. tpl-possession  kad "KAU KINI IALAH ..." (jiwa pelajar masuk ke jasad tokoh)
    4. tpl-diary       halaman diari + nota lekat selepas misi
    5. tpl-hotspot     misi Cari Bukti (gambar + panel bukti di kanan yang boleh ditutup)
    6. tpl-pieces      kertas koyak: kepingan LENCANA bertambah selepas setiap misi
    7. tpl-artifak     hadiah Kepungan: artifak yang digelapkan (sebelum perang bermula)
    8. tpl-bookend     akhir era: halaman diari / kepingan terkumpul ke dalam buku
    9. tpl-sound       tetapan bunyi di Pintu (hab): senyap + gelangsar muzik / kesan
  ============================================================================
-->

  <!-- 1. KOTAK DIALOG ------------------------------------------------------
       Tokoh lain: potret di kiri. Kau (pelajar): potret di kanan, kotak biru
       (data-tone="me" ditetapkan oleh JavaScript, rupanya dalam game.css). -->
  <template id="tpl-dialogue">
    <div class="dlg hidden">
      <div class="dlg-portrait" data-ref="portrait"></div>      <!-- potret penutur -->
      <div class="dlg-portrait dlg-me" data-ref="mePortrait"></div> <!-- potret kau, hanya semasa Giliran Anda -->
      <div class="dlg-panel px" data-ref="panel">
        <div class="dlg-name" data-ref="name"></div>             <!-- nama penutur -->
        <div class="dlg-text" data-ref="text"></div>             <!-- ayat (ditaip satu-satu) -->
        <div class="dlg-more" data-ref="more">▼</div>           <!-- tanda "tekan Enter" -->
      </div>
      <div class="dlg-choices" data-ref="choices"></div>         <!-- butang pilihan jawapan -->
    </div>
  </template>

  <!-- 2. ADEGAN AKIBAT -------------------------------------------------------
       Gambar latar dikuncupkan warnanya, retak, cop "SEJARAH BERUBAH",
       kemudian akibat ditaip. -->
  <template id="tpl-aftermath">
    <div class="am-wrap">
      <div class="am-pic" data-ref="pic"></div>                  <!-- gambar latar babak -->
      <div class="am-crack"><i></i><i></i></div>                 <!-- retakan benang cerita -->
      <div class="am-card px">
        <div class="am-stamp" data-text="title"></div>           <!-- cop: SEJARAH BERUBAH -->
        <div class="am-label">Apa yang berlaku...</div>
        <p class="am-text" data-ref="text"></p>                  <!-- akibat (ditaip) -->
        <div class="am-go">Tekan Enter ▶</div>
      </div>
    </div>
  </template>

  <!-- 3. KAD PERASUKAN (POSSESSION) -----------------------------------------
       Avatar pelajar  ⟶  tokoh sebenar. Kemudian Pendekar Bayang menerangkan. -->
  <template id="tpl-possession">
    <div class="pos-wrap">
      <div class="pos-glow"></div>
      <div class="pos-stage">
        <div class="pos-from" data-ref="from"></div>             <!-- avatar pelajar -->
        <div class="pos-arrow">⟶</div>
        <div class="pos-to" data-ref="to"></div>                 <!-- tokoh peranan -->
      </div>
      <div class="pos-card px">
        <div class="pos-label">KAU KINI IALAH</div>
        <div class="pos-name" data-text="name"></div>            <!-- nama tokoh -->
        <div class="pos-task" data-text="task"></div>            <!-- sumbangan tokoh -->
        <div class="pos-go" data-ref="go">Tekan Enter ▶</div>
      </div>
    </div>
  </template>

  <!-- 4. HALAMAN DIARI + NOTA LEKAT -----------------------------------------
       Dipaparkan dalam tetingkap selepas misi berjaya. Kertas = halaman.png
       (ditetapkan sebagai --paper-img dalam game.css). -->
  <template id="tpl-diary">
    <div class="diary-page">
      <span class="diary-tab" data-text="tab"></span>            <!-- "Diari <nama tokoh>" -->
      <p class="sticky" data-text="note"></p>                    <!-- catatan (nota lekat kuning) -->
    </div>
  </template>

  <!-- 5. MISI CARI BUKTI ---------------------------------------------------
       Gambar penuh untuk dicari. Senarai bukti ada di PANEL KANAN yang boleh
       ditutup (butang ◀/▶), supaya tiada bukti tersembunyi di bawah nama. -->
  <template id="tpl-hotspot">
    <div class="hs-root">
      <!-- Kotak arahan: duduk DI ATAS gambar (bukan menutupnya) -->
      <div class="hs-note" data-ref="note">   <!-- JS memindahkannya ke bar atas misi (quests.js: HotspotQuest.build) -->
        <b>Cara bermain:</b> klik pada gambar untuk mencari bukti. Kesilapan hanya dikira jika klik jauh dari bukti.
      </div>
      <!-- Ruang gambar: pentas 16:9 di dalamnya dikira supaya SENTIASA muat (tidak melimpah) -->
      <div class="hs-area">
      <div class="hs-stage" data-ref="stage">
        <div class="hs-scene" data-ref="scene"></div>             <!-- gambar yang diklik -->
        <aside class="hs-side px" data-ref="side">                 <!-- panel kanan -->
          <button class="hs-toggle" data-ref="toggle" type="button" title="Buka / tutup senarai bukti">▶</button>
          <div class="hs-side-title">BUKTI <span data-ref="count"></span></div>
          <ol class="hs-slots" data-ref="slots"></ol>             <!-- 1. ??? / nama bukti yang dijumpai -->
        </aside>
      </div>
      </div>
    </div>
  </template>

  <!-- 5b. MODUL BANTUAN PEMBELAJARAN ADAPTIF --------------------------------
       Dibuka dengan butang "?" (blok Mario) semasa dialog ATAU misi.
       SATU SKRIN, tanpa tab dan tanpa skrol:
         kiri  : "Apa yang berlaku?" + "Apa perlu dibuat?"  (teks pendek)
         kanan : demo bergerak (mekanik misi, atau cara menggerakkan dialog)
       JavaScript: support.js (SupportModule.open) -->
  <template id="tpl-bantuan">
    <div class="bt-wrap">
      <div class="bt-text">
        <section class="bt-block">
          <h4>Apa yang berlaku?</h4>
          <p class="bt-big" data-text="story"></p>
          <p class="bt-last" data-text="last"></p>
        </section>
        <section class="bt-block">
          <h4 data-text="doTitle"></h4>
          <p class="bt-big" data-text="doText"></p>
        </section>
      </div>
      <div class="bt-demo" data-ref="demo"></div>                 <!-- demo bergerak dimasukkan di sini -->
    </div>
  </template>

  <!-- 5c. TUTORIAL MEKANIK (lima demo bergerak) -------------------------------
       Tangan 👆 menunjukkan klik sebenar. Gerakan ditentukan oleh CSS (@keyframes tt-*).
       Satu templat bagi setiap jenis misi: tpl-tutor-1 ... tpl-tutor-5 -->
  <template id="tpl-tutor-0">   <!-- Cara menggerakkan dialog -->
    <div class="tt-demo tt-t0">
      <div class="tt-title">Cara bercerita</div>
      <div class="tt-stage">
        <div class="tt-dlg"><b>Watak</b><span>Ikut aku, kita ke dewan itu...</span><i class="tt-more">&#9660;</i></div>
        <div class="tt-dlg tt-me"><b>Kau</b><span>Baik, aku datang!</span></div>
        <span class="tt-hand">&#128070;</span>
      </div>
      <ol class="tt-steps">
        <li>Klik kotak dialog (atau tekan Enter) untuk teruskan.</li>
        <li>Kotak biru = Giliran Anda: pilih jawapan.</li>
        <li>Butang Petunjuk (&#128161;) hanya boleh dipakai semasa misi.</li>
      </ol>
    </div>
  </template>
  <template id="tpl-tutor-1">   <!-- Susun Garis Masa -->
    <div class="tt-demo tt-t1">
      <div class="tt-title">Susun Garis Masa</div>
      <div class="tt-stage">
        <div class="tt-row">
          <span class="tt-slot s1">1</span><span class="tt-slot s2">2</span><span class="tt-slot s3">3</span>
        </div>
        <div class="tt-row">
          <span class="tt-card c1">Peristiwa pertama</span><span class="tt-card c2">Peristiwa kedua</span><span class="tt-card c3">Peristiwa ketiga</span>
        </div>
        <span class="tt-hand">👆</span>
      </div>
      <ol class="tt-steps">
        <li>Klik satu kad peristiwa.</li>
        <li>Klik petak nombor tempat kad itu patut berada.</li>
        <li>Kad yang betul akan terkunci. Kad yang salah memutuskan rantai (titisan air hilang).</li>
      </ol>
    </div>
  </template>
  <template id="tpl-tutor-2">   <!-- Cari Hotspot -->
    <div class="tt-demo tt-t2">
      <div class="tt-title">Cari Bukti</div>
      <div class="tt-stage">
        <div class="tt-pic"><span class="tt-target"></span><span class="tt-ripple"></span></div>
        <div class="tt-list"><b>BUKTI <span>0/1</span></b><i>???</i></div>
        <span class="tt-hand">👆</span>
      </div>
      <ol class="tt-steps">
        <li>Perhatikan gambar dengan teliti.</li>
        <li>Klik tempat yang kau rasa ada bukti.</li>
        <li>Bukti yang betul ditandakan dan masuk ke senarai di kanan.</li>
      </ol>
    </div>
  </template>
  <template id="tpl-tutor-3">   <!-- Bantu NPC -->
    <div class="tt-demo tt-t3">
      <div class="tt-title">Bantu Watak</div>
      <div class="tt-stage">
        <div class="tt-ask">Watak memerlukan bantuanmu. Apa patut dilakukan?</div>
        <div class="tt-opts"><span class="tt-opt o1">Pilihan A</span><span class="tt-opt o2">Pilihan B</span><span class="tt-opt o3">Pilihan C</span></div>
        <span class="tt-hand">👆</span>
      </div>
      <ol class="tt-steps">
        <li>Baca keadaan watak itu.</li>
        <li>Klik satu pilihan sahaja.</li>
        <li>Hati-hati: pada misi ini, sekali silap cerita runtuh.</li>
      </ol>
    </div>
  </template>
  <template id="tpl-tutor-4">   <!-- Padanan -->
    <div class="tt-demo tt-t4">
      <div class="tt-title">Padanan</div>
      <div class="tt-stage">
        <div class="tt-row"><span class="tt-card m1">Tunku Abdul Rahman</span><span class="tt-card m2">Bapa Kemerdekaan</span></div>
        <div class="tt-row"><span class="tt-card m3">Tun Razak</span><span class="tt-card m4">Bapa Pembangunan</span></div>
        <span class="tt-hand">👆</span>
      </div>
      <ol class="tt-steps">
        <li>Klik satu kad.</li>
        <li>Klik kad lain yang berpasangan dengannya (di mana-mana sahaja).</li>
        <li>Pasangan yang betul bertukar hijau dan terkunci.</li>
      </ol>
    </div>
  </template>
  <template id="tpl-tutor-5">   <!-- Nyahkod Clue -->
    <div class="tt-demo tt-t5">
      <div class="tt-title">Nyahkod Petunjuk</div>
      <div class="tt-stage">
        <div class="tt-ask">Petunjuk: &quot;Dia ____ perjanjian itu.&quot;</div>
        <div class="tt-opts"><span class="tt-opt o1">menolak</span><span class="tt-opt o2">menandatangani</span><span class="tt-opt o3">membakar</span></div>
        <span class="tt-hand">👆</span>
      </div>
      <ol class="tt-steps">
        <li>Baca petunjuk yang tidak lengkap.</li>
        <li>Pilih perkataan yang melengkapkan maksudnya.</li>
        <li>Rujuk cerita tadi jika ragu-ragu.</li>
      </ol>
    </div>
  </template>

  <!-- 5d. LOMPONG MASA (tempat rehat) ----------------------------------------
       Ruang kosong di antara zaman. Dibuka di sempadan tahap, bila murid menyambung era,
       DAN bila murid menekan Jeda (Esc). Semuanya muat dalam satu skrin (tanpa skrol):
         atas   : tajuk + pedagang (Pendekar Bayang menyamar) bercakap
         tengah : CAROUSEL tahap. Setiap tahap = jubin babak (latar babak itu).
                  hijau = sudah selesai, bercahaya = seterusnya, kelabu = belum
         bawah  : tiga mini game (butang besar) + Teruskan cerita
       Mini game dibuka di tempat carousel (bukan di bawahnya) supaya tidak perlu skrol.
       JavaScript: rehat.js (RehatPage.show) -->
  <template id="tpl-rehat">
    <div class="rh-root">
      <div class="rh-drift" data-ref="drift"></div>               <!-- helaian & bintang melayang di kekosongan -->
      <div class="rh-card px parchment">

        <header class="rh-head">
          <div class="rh-judul">                                    <!-- kiri: kicker kecil di atas, tajuk besar di bawah -->
            <span class="rh-kicker" data-text="kicker"></span>
            <h2 class="rh-title" data-text="title"></h2>
          </div>
          <button type="button" class="btn-px small danger rh-leave hidden" data-ref="btnLeave"><i class="fas fa-right-from-bracket"></i> Keluar ke peta</button>   <!-- kanan: merah + ikon Font Awesome, hanya semasa Jeda -->
        </header>

        <div class="rh-host">                                      <!-- pedagang + ucapannya -->
          <div class="rh-merchant" data-ref="merchant"></div>
          <p class="rh-say" data-ref="say"></p>
        </div>

        <!-- CAROUSEL TAHAP -->
        <section class="rh-main" data-ref="main">
          <div class="rh-carousel">
            <button type="button" class="rh-arrow" data-ref="prev" title="Tahap sebelumnya">&#9664;</button>
            <div class="rh-viewport">
              <div class="rh-track" data-ref="track"></div>      <!-- satu .rh-panel bagi setiap tahap -->
            </div>
            <button type="button" class="rh-arrow" data-ref="next" title="Tahap seterusnya">&#9654;</button>
          </div>
          <div class="rh-dots" data-ref="dots"></div>
        </section>

        <!-- MINI GAME (dibuka di tempat carousel) -->
        <section class="rh-arena hidden" data-ref="arena">
          <div class="rh-arena-bar">
            <span data-ref="gameName"></span>
            <button type="button" class="btn-px small" data-ref="btnBack">Selesai, kembali</button>
          </div>
          <div class="rh-play" data-ref="play"></div>
        </section>

        <!-- BUTANG BAWAH: tiga mini game + teruskan -->
        <footer class="rh-actions" data-ref="actions">
          <button type="button" class="rh-game" data-ref="btnMemory">
            <img src="../assets/gameAsset/hub/diari.png" alt=""><b>Padan Kad</b><small>Cari pasangan gambar</small>
          </button>
          <button type="button" class="rh-game" data-ref="btnBubble">
            <img src="../assets/gameAsset/hub/moon.png" alt=""><b>Pecah Gelembung</b><small>Santai, tiada markah</small>
          </button>
          <button type="button" class="rh-game" data-ref="btnSeek">
            <img src="../assets/gameAsset/hub/pintu.png" alt=""><b>Cari Pendekar</b><small>Dia bersembunyi!</small>
          </button>
          <!-- butang main: sama saiz dengan tiga mini game supaya sejajar -->
          <button type="button" class="rh-game rh-play-btn" data-ref="btnGo" title="Teruskan cerita">
            <i class="rh-play-ico"></i><b>Main</b><small>Teruskan cerita</small>
          </button>
        </footer>

      </div>
    </div>
  </template>

  <!-- 5e. PERALIHAN BABAK: TANGAN MENARIK JIWA -> BUKU DISELAK -----------------
       Urutan: tangan menarik jiwa (soulPull, core.js) -> latar kekosongan dengan buku terbuka
       memenuhi skrin dari tepi ke tepi -> halaman diselak beberapa kali -> babak baharu.
       Pendekar Bayang berkata "Kisah ini belum selesai...".
       Gambar & gerakan: CSS (.sb-*). JavaScript: halaman.js (selakBuku) -->
  <template id="tpl-halaman">
    <div class="sb-void">
      <div class="sb-book">                                       <!-- hub/buku.png, diregang tepi ke tepi -->
        <div class="sb-leaf"></div>                               <!-- tiga helaian (halaman.png) diselak berturut-turut -->
        <div class="sb-leaf"></div>
        <div class="sb-leaf"></div>
      </div>
      <div class="sb-line px">
        <b data-text="speaker"></b>
        <span data-text="line"></span>
      </div>
    </div>
  </template>

  <!-- 5f. LOG DIALOG (buku catatan) ------------------------------------------
       Butang "Catatan" di HUD membuka senarai baris yang sudah dikatakan dalam BABAK SEMASA.
       Baris murid berwarna biru (seperti Giliran Anda). Jawapan Giliran Anda tidak dipaparkan.
       JavaScript: missionScene.js (logNow) -->
  <template id="tpl-log">
    <div class="lg-wrap">
      <ol class="lg-list" data-ref="list"></ol>                   <!-- satu .lg-row bagi setiap baris -->
    </div>
  </template>
  <template id="tpl-logrow">
    <li class="lg-row">
      <div class="lg-face" data-ref="face"></div>                 <!-- potret kecil pembicara -->
      <div class="lg-msg">
        <b data-text="name"></b>
        <p data-text="text"></p>
      </div>
    </li>
  </template>

  <!-- 6. KEPINGAN LENCANA ---------------------------------------------------
       Dipaparkan selepas setiap misi (kecuali yang terakhir, kerana lencana penuh
       terus diberikan). Latar = kertas koyak (hub/halaman.png).
       Atas: nama era. Tengah: lencana sebagai bayang; kepingan koyak yang sudah diperoleh berwarna.
       Bawah: bilangan kepingan. Satu misi = satu kepingan.
       JavaScript (missionScene.js: showPieces) mengisi <svg data-ref="svg"> dengan kepingan;
       bentuk kepingan dikira dalam koyak.js. -->
  <template id="tpl-pieces">
    <div class="pc-wrap">
      <div class="pc-sheet">                                      <!-- bayang kertas (drop-shadow tidak ikut koyakan jika di luar clip) -->
        <div class="pc-paper">                                    <!-- halaman.png, tepi dikoyakkan dengan clip-path -->
          <div class="pc-era" data-text="era"></div>             <!-- nama era -->
          <svg class="pc-svg" data-ref="svg" viewBox="0 0 300 300"></svg>   <!-- kepingan kertas koyak lencana -->
          <div class="pc-count" data-text="count"></div>         <!-- contoh: 2 / 5 -->
          <div class="pc-note">kepingan lencana</div>
        </div>
      </div>
      <button class="btn-px gold pc-go" data-ref="go">Halaman seterusnya ▶</button>   <!-- Enter pun boleh -->
    </div>
  </template>

  <!-- 7. ARTIFAK KEPUNGAN (BAYANG) ------------------------------------------
       Sebelum perang: murid nampak artifak yang digelapkan + markah yang perlu dicapai.
       Hanya motivasi; artifak sebenar dibuka selepas Kepungan (kesan meriam sedia ada). -->
  <template id="tpl-artifak">
    <div class="af-wrap">
      <div class="af-card px">
        <div class="af-label">HADIAH KEPUNGAN</div>
        <div class="af-stage">
          <img class="af-base" src="../assets/gameAsset/collection/artifact_place_locked.png" alt="">
          <img class="af-sprite" data-ref="sprite" alt="">       <!-- artifak (bayang gelap) -->
        </div>
        <div class="af-need" data-text="need"></div>             <!-- contoh: Capai 80% untuk membukanya -->
      </div>
      <div class="af-go" data-ref="go">Tekan Enter ▶</div>
    </div>
  </template>


  <!-- 8. KISAH ERA LENGKAP -------------------------------------------------
       Akhir cerita: setiap misi = satu halaman kertas yang terbang masuk ke dalam buku.
       JavaScript (missionScene.js: showBookEnd) menambah halaman ke <div data-ref="pages">. -->
  <template id="tpl-bookend">
    <div class="be-wrap">
      <div class="be-pages" data-ref="pages"></div>              <!-- halaman kertas (satu setiap misi) -->
      <div class="be-book" data-ref="book"></div>                <!-- buku.png -->
      <div class="be-title" data-text="title"></div>             <!-- contoh: Kisah Era 2 lengkap -->
      <div class="be-count" data-text="count"></div>             <!-- contoh: 5 halaman -->
    </div>
  </template>

  <!-- 9. TETAPAN BUNYI -----------------------------------------------------
       Dipaparkan dalam kotak "Pintu" di hab. Gelangsar 0 - 100, disimpan dalam pelayar.
       JavaScript (scenes.js: doorMenu) mengisi nilai dan mendengar perubahan. -->
  <template id="tpl-sound">
    <div class="set-sound">
      <button class="btn-px small set-mute" data-ref="mute"></button>   <!-- senyap / hidupkan -->
      <label class="set-row">Muzik <input type="range" min="0" max="100" data-ref="music"></label>
      <label class="set-row">Kesan bunyi <input type="range" min="0" max="100" data-ref="sfx"></label>
    </div>
  </template>
</body>
</html>
