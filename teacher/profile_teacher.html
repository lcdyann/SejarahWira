<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SejarahWira - Profil Guru</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/teacherProfile.css">
  <link rel="stylesheet" href="../assets/css/teacher.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/theme.js"></script>
</head>

<body class="game-body tpf-body">

  <div id="top-nav-placeholder"></div>

  <main class="tpf-wrapper">
    <header class="tpf-header">
      <h1><i class="fas fa-chalkboard-teacher"></i> Profil Guru</h1>
      <p>Maklumat akaun dan kelas anda.</p>
    </header>

    <!-- AKSES DITOLAK--> 
    <section id="tpf-denied" class="tpf-state is-hidden" role="alert">
      <i class="fas fa-lock"></i>
      <p id="tpf-denied-text">Halaman ini hanya untuk guru.</p>
      <a class="tpf-btn tpf-btn-primary" href="../index.html"><i class="fas fa-right-to-bracket"></i> Log Masuk</a>
    </section>
    
    <section id="tpf-loading" class="tpf-state">
      <i class="fas fa-circle-notch fa-spin"></i>
      <p>Memuatkan profil...</p>
    </section>

    <section id="tpf-error" class="tpf-state is-hidden" role="alert">
      <i class="fas fa-triangle-exclamation"></i>
      <p id="tpf-error-text">Gagal memuatkan profil.</p>
      <button type="button" class="tpf-btn tpf-btn-primary" id="btn-retry"><i class="fas fa-rotate-right"></i> Cuba Lagi</button>
    </section>

    <div id="tpf-content" class="is-hidden">

      <section class="tpf-card tpf-identity" aria-labelledby="tpf-name">
        <div class="tpf-avatar" id="tpf-avatar" aria-hidden="true">G</div>
        <div class="tpf-identity-info">
          <h2 id="tpf-name">Guru</h2>
          <dl class="tpf-info">
            <div><dt><i class="fas fa-id-badge"></i> ID Guru</dt><dd id="info-teacherID">-</dd></div>
            <div><dt><i class="fas fa-at"></i> Nama Pengguna</dt><dd id="info-username">-</dd></div>
          </dl>
        </div>
        <div class="tpf-stats" id="tpf-stats"></div>
      </section>

      <section class="tpf-card" aria-labelledby="tpf-classes-title">
        <div class="tpf-card-head">
          <h2 id="tpf-classes-title"><i class="fas fa-school"></i> Kelas Saya</h2>
          <a class="tpf-btn tpf-btn-primary tpf-btn-sm" href="class_manager.html"><i class="fas fa-plus"></i> Urus Kelas &amp; Pelajar</a>
        </div>
        <div id="tpf-classes"></div>
      </section>
    </div>

    <!-- AKAUN: butang Logout (dahulu di bar atas). Di luar kotak di atas supaya sentiasa ada,
         walaupun profil gagal dimuatkan. -->
    <section class="tpf-card tpf-account" aria-labelledby="tpf-account-title">
      <div class="tpf-card-head">
        <h2 id="tpf-account-title"><i class="fas fa-user-lock"></i> Akaun</h2>
        <button type="button" id="btn-logout" class="pixel-btn pixel-btn-logout">
          <i class="fas fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </section>
  </main>

  <script src="../assets/js/topNav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderTopNav({ homeUrl: 'index.html' });
      document.getElementById('btn-logout').addEventListener('click', () => teacherLogout('../index.html'));
    });
  </script>
  <script src="../assets/js/teacherProfileEngine.js"></script>
</body>
</html>
